[package]
name = "pop_pop_win"
version = "0.1.0"
edition = "2024"
default-run = "pop_pop_win"

[dependencies]
bevy = { version = "0.15", default-features = false, features = [
    "bevy_winit",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "bevy_audio",
    "bevy_asset",
    "bevy_state",
    "png",
    "jpeg",
    "vorbis",
] }
bevy_embedded_assets = "0.12"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
web-time = "1.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.15", default-features = false, features = ["x11"] }
image = { version = "0.25", default-features = false, features = ["png"] }
winit = { version = "0.30", default-features = false }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.15", default-features = false, features = ["webgl2"] }
getrandom = { version = "0.2", features = ["js"] }
getrandom_0_3 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
uuid = { version = "1", features = ["js"] }
web-sys = { version = "0.3", features = ["Window", "Storage"] }

[dev-dependencies]

[profile.release]
opt-level = "s"
lto = "thin"
strip = "debuginfo"

[package]
name = "pop_pop_win"
version = "0.1.0"
edition = "2024"
default-run = "pop_pop_win"

[dependencies]
bevy = { version = "0.15", default-features = false, features = [
    "bevy_winit",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "bevy_audio",
    "bevy_asset",
    "bevy_state",
    "png",
    "jpeg",
    "vorbis",
    "x11",
] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
